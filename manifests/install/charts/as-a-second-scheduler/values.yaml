# Default values for scheduler-plugins-as-a-second-scheduler.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

scheduler:
  name: scheduler-plugins-scheduler
  image: registry.k8s.io/scheduler-plugins/kube-scheduler:v0.32.7
  command:
    - /bin/kube-scheduler
  replicaCount: 1
  leaderElect: false
  priorityClassName: ""
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []

controller:
  name: scheduler-plugins-controller
  image: registry.k8s.io/scheduler-plugins/controller:v0.32.7
  replicaCount: 1
  leaderElect: false
  priorityClassName: ""
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []

# HyperAI plugin configuration for ML-based node scoring

plugins:
  enabled: ["HyperAI"]
  disabled: ["*"] # disable all other plugins for HyperAI-only setup

# Customize the HyperAI plugin configuration.
# Refer to the "pluginConfig" section of manifests/hyperai/scheduler-config.yaml.
pluginConfig:
  - name: HyperAI
    args:
      grpcAddress: "localhost:50051" # gRPC server address for Python scoring service
      score: 0 # fallback score when gRPC unavailable
