apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperai-scheduler-sidecar
  namespace: scheduler-plugins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hyperai-scheduler-sidecar
  template:
    metadata:
      labels:
        app: hyperai-scheduler-sidecar
    spec:
      serviceAccountName: scheduler-plugins-scheduler
      containers:
        # Main scheduler container
        - name: kube-scheduler
          image: hyperai-scheduler:latest
          imagePullPolicy: Never # For local kind testing
          command:
            - /kube-scheduler
            - --config=/etc/kubernetes/scheduler-config.yaml
            - --v=2
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Wait for gRPC server to be ready
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10

        # HyperAI gRPC server sidecar
        - name: hyperai-grpc-server
          image: hyperai-grpc-server:latest
          imagePullPolicy: Never # For local kind testing
          ports:
            - containerPort: 50051
              name: grpc
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # Health check for gRPC server
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:
        - name: config
          configMap:
            name: hyperai-scheduler-config-sidecar
