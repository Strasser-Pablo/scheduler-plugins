apiVersion: v1
kind: Pod
metadata:
  name: hyperai-test-pod
  labels:
    app: hyperai-test
spec:
  schedulerName: hyperai-scheduler
  containers:
    - name: test-container
      image: busybox:1.35
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
  restartPolicy: Never
