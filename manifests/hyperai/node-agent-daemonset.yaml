apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hyperai-node-agent
  namespace: scheduler-plugins
  labels:
    app: hyperai-node-agent
spec:
  selector:
    matchLabels:
      app: hyperai-node-agent
  template:
    metadata:
      labels:
        app: hyperai-node-agent
    spec:
      serviceAccountName: hyperai-node-agent
      hostNetwork: true # Use host network for better node connectivity
      containers:
        - name: node-agent
          image: hyperai-node-agent:latest
          imagePullPolicy: Never # For local kind testing
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # Health check for the node agent
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 10
          # Volume mounts for accessing host information if needed
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
      tolerations:
        # Allow running on control plane nodes
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
