apiVersion: v1
kind: Pod
metadata:
  name: hyperai-test-pod-daemonset
  namespace: scheduler-plugins
  labels:
    app: hyperai-test-pod
spec:
  schedulerName: hyperai-scheduler-sidecar
  containers:
    # Main application container (no sidecar needed)
    - name: test-app
      image: busybox:1.35
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

  restartPolicy: Never
