syntax = "proto3";

package hyperai;

option go_package = "sigs.k8s.io/scheduler-plugins/pkg/hyperai";

// Central HyperAI service
service HyperAI {
  // Scheduler -> Central server
  rpc GetScore (ScoreRequest) returns (ScoreReply) {}

  // Node Agent <-> Central server (bidirectional streaming control plane)
  rpc AgentConnect (stream AgentMessage) returns (stream ServerMessage) {}
}

// Original scheduler -> central server request
message ScoreRequest {
  string pod_json = 1;
  string node_json = 2;
}

message ScoreReply {
  int64 score = 1;
}

// ===== Streaming control plane messages =====

// Messages sent from Agent to Server
message AgentMessage {
  oneof msg {
    AgentHello hello = 1;
    AgentHeartbeat heartbeat = 2;
    AgentScoreResponse score_response = 3;
  }
}

// Messages sent from Server to Agent
message ServerMessage {
  oneof msg {
    ServerScoreRequest score_request = 1;
    ServerControl control = 2; // reserved for future
  }
}

message AgentHello {
  string node_name = 1;
  string agent_version = 2;
  repeated string capabilities = 3;
  map<string, string> labels = 4;
  string model = 5;
}

message AgentHeartbeat {
  int64 ts = 1; // unix seconds
}

message ServerScoreRequest {
  string request_id = 1;
  string pod_json = 2;
  string node_json = 3;
}

message AgentScoreResponse {
  string request_id = 1;
  int64 score = 2;
  bool success = 3;
  string message = 4;
}

message ServerControl {
  string type = 1;
  string payload = 2;
}
